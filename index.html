<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- VERSION DE LA PAGINA. Se compara con la del index.html publicado en GitHub Pages para
     avisar cuando la TV quedo con una copia vieja en cache. SUBIRLA EN CADA COMMIT que
     toque este archivo: si no se sube, el aviso nunca salta. -->
<meta name="monitor-version" content="2026-09-25.30">
<title>Monitor Matricería</title>
<style>
  /* Pensado para una TV de 32" a 1920×1080 mirada de lejos: fondo oscuro, letra
     grande y NADA de scroll. Todo se mide en vh/vw, así el mismo archivo sirve
     igual en 1366×768 o en un monitor vertical sin tocar una línea. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0d1117;color:#e6edf3;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  }
  /* Sin giro, #rot ocupa la pantalla y se comporta igual que el body de antes. */
  #rot{width:100%;height:100%;display:flex;flex-direction:column}
  /* Con giro, la caja se arma AL REVES -alto de pantalla como ancho y viceversa- y despues
     se rota. El translate es para traerla de vuelta al area visible: rotando 90 grados desde
     la esquina de arriba a la izquierda, la caja se va toda a la izquierda del borde. */
  body.giro #rot{position:absolute;top:0;left:0;width:100vh;height:100vw;transform-origin:top left}
  body.giro90  #rot{transform:translateX(100vw) rotate(90deg)}
  body.giro270 #rot{transform:translateY(100vh) rotate(-90deg)}
  /* ?vista=1: LUPA para mirar desde una PC como queda la TV ya enderezada. NO es un modo
     de la TV. La clave es que NO toca la geometria: #rot sigue siendo 100vh x 100vw y los
     vw/vh de todo el resto se siguen calculando contra la MISMA ventana, asi que el layout
     y el tamano de letra salen IDENTICOS a los de ?giro=90. Lo unico que cambia es el
     transform: en vez de rotar, achica para que la caja parada entre en la ventana acostada
     y la centra. Va DESPUES de las dos de arriba a proposito -misma especificidad, gana la
     ultima- y pintar() no se entera, porque mide con offset*/client*, que el transform no toca. */
  body.vista{background:#010409}
  body.vista #rot{top:50%;left:50%;transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--esc,1))}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.6vh 2vw;border-bottom:.35vh solid #21262d;flex:0 0 auto;
  }
  /* ⚠ EL NAVEGADOR DE LA TV (aparato tipo Roku) IGNORA 'gap' EN FLEX. Lo descarta sin avisar,
     así que TODO lo que se separaba con gap queda pegado en la pantalla real: en el título
     "MATRICERÍA12 matrices", y en cada renglón "1Pastillas manopla" y "23/09Reponer…".
     Por eso en este archivo la separación NUNCA va con gap: va con margin/padding, que el
     aparato sí respeta. Si mañana se agrega una columna o un dato, separalo con margin. */
  .titulo{display:flex;align-items:baseline}
  .titulo h1{font-size:4.2vh;letter-spacing:.06em;font-weight:800}
  .titulo .sub{font-size:2.2vh;color:#8b949e;margin-left:1.4vw}
  .reloj{font-size:4.2vh;font-weight:700;font-variant-numeric:tabular-nums;margin-left:1.2vw}
  .reloj .fecha{display:block;font-size:1.8vh;font-weight:400;color:#8b949e;text-align:right}
  /* Lector de resolucion: APAGADO por defecto (en la TV es ruido). Se prende con ?res=1
     cuando hay que averiguar con que medida dibuja una pantalla nueva. */
  .res{
    font-size:1.7vh;font-variant-numeric:tabular-nums;color:#8b949e;text-align:right;
    background:#161b22;border:.25vh solid #30363d;border-radius:.8vh;padding:.6vh 1vw;
  }
  .res b{color:#e6edf3;font-size:2.1vh;display:block}
  .res.oculto{display:none}

  /* Flex en vez de grid: con la ultima fila incompleta (10 matrices en 4 columnas) las que
     quedan se CENTRAN en vez de dejar un hueco a la derecha. Las medidas de cada tarjeta
     las calcula el JS para que entren todas. */
  main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
       padding:1.6vh 2vw;min-height:0;overflow:hidden}

  /* UN RENGLON POR MATRIZ, CON EL FORMATO DE CUADRO SINOPTICO (pedido de Elias,
     23/09/2026: "se va a ver todo en una linea con fecha ingreso, descripcion y estado" +
     "aplicar el formato de cuadro sinoptico, sin excluir ninguna regla"). De ese formato
     salen, una por una:
       - ancho de columna segun el DATO, no segun el titulo  -> lo mide ajustarColumnas()
         (medido a 962x485 con 11 matrices: "Prio." pedia 50px cuando el numero ocupa 23,
          e "Ingreso" pedia 70 cuando "22/09" ocupa 48. Las dos son UNA palabra, asi que no
          se pueden partir en dos lineas: el formato manda abreviar. "#" e "Ing." bajan la
          tabla de 499 a 450px y ya ninguna columna la manda el titulo)
       - titulo mas grande que el contenido (16 contra 14)   -> .th span va a 1.14em
       - centrado horizontal y vertical                      -> en las celdas y en la tabla
       - sin ancho fijo, sin columnas vacias
     EXCEPCION pedida por Elias: "por el color y el relleno segui la estetica de la pagina".
     O sea que el cuadro conserva el fondo de los renglones, la barra del estado y el chip
     de color; el resto del formato se cumple tal cual.
       - ordenado por gravedad de mayor a menor              -> lo trae la consulta, por demora
       - tabla solo con 3 filas o mas; con menos, lista      -> con n<3 no se dibuja el encabezado
     Todo en EM sobre --fs, que calcula el JS segun cuantos renglones hay. */
  /* width:auto y columnas medidas = columnas proximas, sin ancho sobrante. La tabla queda
     del ancho de sus datos y el <main> la centra en la pantalla. */
  .tabla{display:flex;flex-direction:column;font-size:var(--fs,16px);width:auto;max-width:100%}
  .tabla.lista{width:100%}
  .th{display:flex;align-items:flex-end;padding:0 .9em .3em}
  .th span{font-size:1.14em;color:#8b949e;line-height:1;white-space:nowrap;text-align:center}
  .fila{
    display:flex;align-items:center;padding:.3em .9em;margin-bottom:.16em;
    background:#161b22;border-radius:.35em;position:relative;overflow:hidden;
  }
  .fila:last-child{margin-bottom:0}
  /* Separación entre columnas por MARGIN (la TV ignora gap, ver nota de arriba). Sólo en la
     tabla horizontal; en la lista vertical no hay columnas. */
  .tabla:not(.lista) .fila>*:not(:first-child),
  .th>*:not(:first-child){margin-left:.55em}
  .fila::before{content:'';position:absolute;left:0;top:0;bottom:0;width:.28em;background:var(--c,#58a6ff)}
  /* TODO EL TEXTO DEL RENGLON VA EN BLANCO Y SIN NEGRITA (Elias, 23/09/2026: "ese cambio de
     texto hacelo a desc ing # problema y espera, sin el bold"). Las clases .aviso y .alerta
     se siguen poniendo en fila() pero ya NO pintan nada.
     ⚠ CONSECUENCIA: la TV pierde la senal de demora. Antes la fecha se ponia ambar a los 3
     dias y roja a los 7, y era lo UNICO que la mostraba: la barra de la izquierda es del
     estado, no de la demora. Hoy la cola la ordenan Pregelj y Cornejo con la columna #, asi
     que el orden dice que atacar primero; si alguna vez hace falta la senal de vuelta, las
     dos reglas de abajo son el lugar. */
  /* Orden de las columnas: # · Ing. · Descripcion · ESTADO · Problema (Elias, 23/09/2026:
     "problema y espera van despues de estado"). De paso resuelve solo el chip descolocado:
     la celda de Estado queda con el chip y nada mas, asi que mide lo que mide un chip y los
     once quedan alineados. Lo que varia de ancho -problema y espera- se fue a la ultima
     columna, donde crecer no descoloca nada. */
  .c-estado i, .lista .l1 i{
    font-style:normal;display:inline-block;padding:.12em .7em;border-radius:99px;
    font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    background:var(--cb,#1f3350);color:var(--c,#58a6ff);white-space:nowrap;
  }
  .c-prio, .c-fecha, .c-desc, .c-estado, .c-prob, .c-espera{display:flex;align-items:center;justify-content:center;min-width:0}
  /* La prioridad es el orden en que hay que atacarlas: la elige Planify, aca solo se muestra. */
  .c-prio  {flex:0 0 var(--w-prio,auto);font-variant-numeric:tabular-nums}
  .c-fecha {flex:0 0 var(--w-fecha,auto);font-variant-numeric:tabular-nums}
  .c-desc  {flex:0 0 var(--w-desc,auto)}
  .c-estado{flex:0 0 var(--w-estado,auto)}
  /* Por que entro la matriz (el "Problema" del modulo). En el mismo blanco que el resto. */
  .c-prob  {flex:0 0 var(--w-prob,auto);color:#e6edf3}
  /* Que se esta esperando, en columna propia detras del problema (Elias, 23/09/2026:
     "problema y espera separados, 1ro problema"). Con columna propia cada una mide lo suyo:
     la de Problema deja de ensancharse por la espera mas larga. A cambio queda vacia en los
     renglones que no esperan nada; por eso pintar() NO dibuja la columna cuando no espera
     ninguna, que es el caso normal.
     En BLANCO, como todo el resto del renglon: el color lo pone el chip de al lado. */
  .c-espera{flex:0 0 var(--w-espera,auto);color:#e6edf3}
  /* Los topes en em evitan que UN texto largo ensanche la tabla y le achique la letra a los
     once renglones. Lo que NO entra en el tope no se corta: se PARTE en dos renglones
     (Elias, 23/09/2026: "misma linea, que sea 2 lineas en caso de sobrepasar el limite de
     texto"). Como los textos de hoy entran de sobra, en la practica no se parte ninguno: la
     segunda linea es la salida de emergencia, no el caso normal. Al tercer renglon si se
     corta, porque si no un texto enorme desarma la pantalla entera. */
  .c-desc span, .c-prob span, .c-espera span{
    white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.15;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }
  .c-desc span{max-width:18em}
  .c-prob span{max-width:16em}
  .c-espera span{max-width:14em;font-size:.92em}

  /* MODO LISTA, para la pantalla vertical. Con la TV dada vuelta quedan 447 px de ancho y
     la tabla de seis columnas no entra: medido, la letra caia a 10,2 px, ilegible desde el
     taller. Asi que en vertical cada matriz ocupa DOS renglones y no hay encabezado — que es
     literalmente lo que pidio Elias, "una lista a lo largo". El alto sobra (828 px), asi que
     gastarlo en un segundo renglon es gratis y el ancho deja de ser el que manda:
     medido, 19,4 px de letra contra los 16,5 de la horizontal. */
  .lista .fila{display:block;padding:.4em .8em}
  .lista .l1{display:flex;align-items:center}
  .lista .l1 .n{font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:1.5em;text-align:right;margin-right:.6em}
  .lista .l1 .d{flex:1 1 auto;min-width:0;margin-right:.6em;white-space:normal;overflow:hidden;
                display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
  /* El chip de estado NO se achica NI se corta: flex 0 0 auto. Antes era achicable y, como su
     texto es nowrap, se salía del renglón y lo clipeaba el borde de la pantalla — de ahí
     "INGRESAI", "PROCES", "ESPERANI". La descripción, que SÍ se puede achicar, le cede el
     lugar y clampa a dos líneas; el estado se lee siempre entero. */
  .lista .l1 i{flex:0 0 auto}
  .lista .l2{display:flex;align-items:baseline;font-size:.84em;margin-top:.16em;padding-left:2.1em}
  .lista .l2 .f{flex:0 0 auto;margin-right:.7em;font-variant-numeric:tabular-nums}
  .lista .l2 .p{flex:1 1 auto;min-width:0;white-space:normal;overflow:hidden;
                display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
  .lista .l2 .e{flex:0 0 auto;margin-left:.6em;white-space:nowrap;max-width:10em;overflow:hidden;text-overflow:ellipsis}

  .vacio{
    flex:1 1 100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:#8b949e;font-size:4vh;text-align:center;
  }
  .vacio .emoji{font-size:9vh;margin-bottom:2vh}

  footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:1.1vh 2vw;border-top:.35vh solid #21262d;font-size:1.9vh;color:#8b949e;
  }
  #estadoConn.mal{color:#ff7b72;font-weight:700}
  #ver{opacity:.55;font-variant-numeric:tabular-nums}

  /* Cartel de version vieja: rojo brillante, letras blancas, arriba de todo. Empuja el
     tablero hacia abajo en vez de taparlo (es un flex item mas), asi no esconde ninguna
     matriz. Late despacio para que se note desde lejos sin marear. */
  #cartelVer{
    display:none;flex:0 0 auto;background:#e5001d;color:#fff;text-align:center;
    font-size:3.2vh;font-weight:800;letter-spacing:.04em;padding:1.4vh 2vw;
    text-transform:uppercase;animation:latir 2.4s ease-in-out infinite;
  }
  #cartelVer.on{display:block}
  @keyframes latir{0%,100%{background:#e5001d}50%{background:#ff2a3d}}

</style>
</head>
<body>
  <!-- Todo el contenido vive adentro de #rot. La TV del taller se colgo DADA VUELTA (Elias,
       23/09/2026: "dimos vuelta la TV para que sea una lista a lo largo"), pero el aparato
       que la maneja sigue mandando la imagen en horizontal: la unica forma de enderezarla es
       rotar la pagina. Con ?giro=0 se ve como antes; con ?giro=270 gira para el otro lado. -->
  <div id="rot">
  <div id="cartelVer"></div>
  <header>
    <div class="titulo">
      <h1>🛠️ MATRICERÍA</h1>
      <span class="sub" id="resumen">cargando…</span>
    </div>
    <div style="display:flex;align-items:center">
      <div class="res" id="res"></div>
      <div class="reloj"><span id="hora">--:--</span><span class="fecha" id="fecha"></span></div>
    </div>
  </header>

  <main id="grilla"></main>

  <footer>
    <span id="estadoConn">Conectando…</span>
    <span id="pie">Se carga desde Planify · Matricería</span>
    <span id="ver"></span>
  </footer>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MONITOR DE MATRICERÍA — visualizador, NO carga nada.
   Lee planify.v_matriceria_monitor del proyecto Supabase de Gestión Virgilio.
   Lo que se ve acá lo cargan Pregelj y Cornejo desde el módulo "Matricería"
   de Planify, y la TV muestra la MISMA planilla: problema, tarea a realizar,
   ya hecho, quién, HS, salida estimada y la foto si la subieron.
   Este archivo no escribe: la clave publishable sólo tiene SELECT sobre esa
   tabla y sobre el bucket de las fotos (los writes van por RPC, ver Planify).
   Parámetros por URL (opcionales):
     ?refresco=30     cada cuántos segundos vuelve a pedir los datos
     ?columnas=4      fuerza las columnas (por defecto las calcula sola)
   TODAS las matrices del taller entran SIEMPRE en una sola pantalla: no hay
   carrusel. La grilla y el tamaño de letra se calculan segun cuantas haya, asi
   que con mas matrices las tarjetas se achican en vez de esconderse.
     ?res=1           muestra el lector de resolucion (apagado por defecto)
     ?autorecarga=0   deja el cartel rojo pero NO recarga sola la pagina
   ══════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://hrxfctzncixxqmpfhskv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BqpAgZH6ty-9wft10_YMhw_0rcIPuWT'; // clave PÚBLICA de solo lectura

const qs         = new URLSearchParams(location.search);
const num        = (k, def) => { const v = parseInt(qs.get(k), 10); return Number.isFinite(v) && v > 0 ? v : def; };
const REFRESCO   = Math.max(5, num('refresco', 30)) * 1000;
const COLUMNAS   = num('columnas', 0);   // 0 = las calcula sola segun cuantas matrices hay
const VER_RES    = qs.get('res')   === '1';   // apagado por defecto: en la TV es ruido

// Los cinco estados y como se llaman en la TV. Si se agrega uno hay que tocar tambien el
// check de planify.matrices_ingresos, la RPC planify_matriz_estado y la lista MAT_ESTADOS
// de Planify: si no, no se puede cargar desde la app.
const ESTADOS = {
  ingresada:  { txt:'Ingresado',  c:'#58a6ff', cb:'#132c4d' },
  en_proceso: { txt:'Proceso',    c:'#e3b341', cb:'#3a2f10' },
  ver_damian: { txt:'Ver Damián', c:'#d2a8ff', cb:'#2f2150' },
  esperando:  { txt:'Esperando',  c:'#ff7b72', cb:'#3d1d1b' },
  terminada:  { txt:'Terminada',  c:'#3fb950', cb:'#12301a' }
};

// Abreviaturas de la descripcion, para ganar ancho sin perder sentido. Hoy solo "corte",
// que es la palabra que mas se repite en el maestro de matrices; agregar otra es sumarle
// un par a esta lista.
const ABREVIATURAS = [[/\bcortes?\b/gi, 'C/']];
function abreviar(t){
  let r = String(t || '');
  for (const [re, x] of ABREVIATURAS) r = r.replace(re, x);
  return r.replace(/\s+/g, ' ').trim();
}

let datos = [];        // última respuesta buena
let ultimaOk = null;   // cuándo trajo datos por última vez

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fecha = d => { if (!d) return '—'; const [y,m,dd] = String(d).split('-'); return dd+'/'+m; };

async function traer(){
  // estado=neq.terminada: el monitor muestra lo que está EN el taller. Cuando la matriz se
  // termina (o se cierra su tarea en Planify) desaparece sola de la TV.
  // El orden lo decide la PRIORIDAD que eligieron en Planify (1 primero). Las que todavía
  // no tienen número quedan al final, por demora, como antes.
  const url = SUPABASE_URL + '/rest/v1/v_matriceria_monitor'
            + '?select=*&estado=neq.terminada'
            + '&order=prioridad.asc.nullslast,dias_demora.desc,fecha_ingreso.asc';
  const r = await fetch(url, { headers:{ apikey:SUPABASE_KEY, 'Accept-Profile':'planify' }, cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

async function actualizar(){
  try{
    const nuevos = await traer();
    // Sólo se pisa lo que se ve si la respuesta vino bien: un corte de red no tiene que
    // dejar la TV en blanco, se sigue viendo lo último que se supo.
    datos = Array.isArray(nuevos) ? nuevos : [];
    ultimaOk = new Date();
    $('estadoConn').textContent = 'En línea · ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    $('estadoConn').className = '';
    pintar();
  }catch(e){
    $('estadoConn').textContent = 'SIN CONEXIÓN' + (ultimaOk ? ' · último dato ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '');
    $('estadoConn').className = 'mal';
  }
}

// Descripcion de la matriz. El NUMERO ya no se muestra: si lo cargaron, se muestra la
// descripcion del maestro; si escribieron texto libre, eso ES la descripcion. El numero se
// sigue usando en Planify para que la misma matriz no termine cargada con una descripcion
// distinta cada vez.
function descripcion(m){
  return abreviar(String(m.nombre_matriz || '').trim() || String(m.numero_matriz || '').trim());
}

// El numero que se ve es la POSICION en la lista, no el valor guardado: asi, cuando una
// matriz se termina, las que quedan siguen numeradas 1, 2, 3... sin huecos.
// Un renglon de la LISTA (pantalla vertical): arriba puesto, descripcion y chip; abajo la
// fecha, el problema y -si espera algo- que espera.
function filaLista(m, i){
  const e = ESTADOS[m.estado] || ESTADOS.ingresada;
  const d = Number(m.dias_demora || 0);
  const clase = d >= 7 ? 'alerta' : (d >= 3 ? 'aviso' : '');
  const espera = m.estado === 'esperando' ? String(m.espera || '').trim() : '';
  const prob = String(m.motivo || '').trim();
  return `<div class="fila ${clase}" style="--c:${e.c};--cb:${e.cb}">`
       + `<div class="l1"><span class="n">${i + 1}</span>`
       +   `<span class="d">${esc(descripcion(m))}</span><i>${e.txt}</i></div>`
       + `<div class="l2"><span class="f">${fecha(m.fecha_ingreso)}</span>`
       +   `<span class="p">${esc(prob || '—')}</span>`
       +   (espera ? `<span class="e">${esc(espera)}</span>` : '')
       + `</div></div>`;
}

function fila(m, i, conEspera){
  const e = ESTADOS[m.estado] || ESTADOS.ingresada;
  const d = Number(m.dias_demora || 0);
  const clase = d >= 7 ? 'alerta' : (d >= 3 ? 'aviso' : '');
  // Si esta esperando algo, va en su columna: "Esperando" solo no dice que falta.
  const espera = m.estado === 'esperando' ? String(m.espera || '').trim() : '';
  return `<div class="fila ${clase}" style="--c:${e.c};--cb:${e.cb}">`
       + `<div class="c-prio"><span>${i + 1}</span></div>`
       + `<div class="c-fecha"><span>${fecha(m.fecha_ingreso)}</span></div>`
       + `<div class="c-desc"><span>${esc(descripcion(m))}</span></div>`
       + `<div class="c-estado"><i>${e.txt}</i></div>`
       + `<div class="c-prob"><span>${esc(String(m.motivo || '').trim() || '—')}</span></div>`
       + (conEspera ? `<div class="c-espera"><span>${espera ? esc(espera) : ''}</span></div>` : '')
       + `</div>`;
}

// Ancho de columna SEGUN EL DATO, no segun el titulo: se mide lo que ocupan de verdad las
// celdas y la columna queda del ancho del valor mas largo. El titulo, si no entra, se parte
// en dos lineas (por eso .th span va con white-space normal), que es lo que pide el formato.
function ajustarColumnas(cont){
  const tabla = cont.querySelector('.tabla');
  if (!tabla) return;
  for (const col of ['prio', 'fecha', 'desc', 'estado', 'prob', 'espera']){
    let max = 0;
    // Se mide el dato Y el titulo. Los titulos ya vienen abreviados ("#", "Ing."), asi que
    // hoy el dato gana en las cuatro columnas y el ancho sale del dato, como pide el formato.
    // El max() queda igual de red de seguridad: si manana un titulo se alarga, la columna lo
    // respeta en vez de dejar un encabezado pisando al de al lado.
    // Se mide la CELDA entera, no sus hijos: la del problema lleva dos cosas al lado (el
    // problema y, si espera algo, la espera) y midiendo hijo por hijo se tomaria el mas
    // ancho en vez de la suma, asi que la columna quedaria corta.
    tabla.querySelectorAll('.fila .c-' + col + ', .th .c-' + col).forEach(el => {
      max = Math.max(max, el.getBoundingClientRect().width);
    });
    if (max) tabla.style.setProperty('--w-' + col, Math.ceil(max) + 'px');
  }
}

const EM_FILA  = 1.95;   // alto de un renglon con su relleno y su separacion, en em
const EM_TH    = 2.6;    // el encabezado, con el titulo a 1,14em y lugar para dos lineas
const EM_ITEM  = 3.05;   // alto de un renglon de la LISTA (dos lineas + relleno), en em
const EM_ANCHO_LISTA = 24; // lo minimo a lo ancho en modo lista
const EM_ANCHO = 44;     // prioridad + fecha + estado + separaciones + lo minimo de descripcion, problema y espera
const FS_MAX   = 40;     // con una o dos matrices, que no quede un renglon gigante

function pintar(){
  const cont = $('grilla');
  const n = datos.length;

  $('resumen').textContent = n
    ? n + (n === 1 ? ' matriz en el taller' : ' matrices en el taller')
    : 'sin matrices en el taller';

  if (!n){
    cont.innerHTML = '<div class="vacio"><span class="emoji">✅</span><span>No hay ninguna matriz en el taller</span></div>';
    return;
  }

  const cs    = getComputedStyle(cont);
  const ancho = cont.clientWidth  - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight)  || 0);
  const alto  = cont.clientHeight - (parseFloat(cs.paddingTop)  || 0) - (parseFloat(cs.paddingBottom) || 0);

  // En pantalla VERTICAL va la lista de dos renglones; en horizontal, la tabla de siempre.
  // No se decide por el ancho medido a proposito: asi es previsible y se puede probar con
  // ?giro=0 sin que la pantalla cambie de forma sola.
  const enLista = document.body.classList.contains('giro');
  // Tabla solo con 3 filas o mas; con menos va como lista, sin encabezado.
  const conTitulos = !enLista && n >= 3;
  // La columna Espera solo existe si alguna matriz espera algo: si no, seria una columna
  // entera vacia, que es justo lo que el formato prohibe.
  const conEspera = datos.some(m => m.estado === 'esperando' && String(m.espera || '').trim());
  // Cuantos renglones se parten en dos no se puede saber antes de dibujar (depende de cuanto
  // mide cada texto con ESTA letra), asi que aca se estima con una linea por matriz y la
  // segunda pasada, que mide el alto real, corrige si alguno se partio.
  const fs = Math.max(9, Math.min(FS_MAX,
                                  alto / (n * (enLista ? EM_ITEM : EM_FILA) + (conTitulos ? EM_TH : 0)),
                                  ancho / (enLista ? EM_ANCHO_LISTA : EM_ANCHO)));

  cont.innerHTML = `<div class="tabla${enLista ? ' lista' : ''}" style="--fs:${fs.toFixed(2)}px">`
    + (conTitulos
        ? '<div class="th"><span class="c-prio">#</span><span class="c-fecha">Ing.</span>'
        + '<span class="c-desc">Descripción</span><span class="c-estado">Estado</span>'
        + '<span class="c-prob">Problema</span>'
        + (conEspera ? '<span class="c-espera">Espera</span>' : '') + '</div>'
        : '')
    + datos.map((m, i) => enLista ? filaLista(m, i) : fila(m, i, conEspera)).join('')
    + '</div>';

  // Segunda pasada, por ANCHO y por ALTO. Ancho: con las columnas ya medidas, si la
  // descripcion mas larga no entra se achica la letra en vez de cortar el texto. Alto: el
  // calculo de arriba es una estimacion en em (EM_FILA / EM_LIN2) y los renglones de dos
  // lineas la vuelven menos exacta, asi que se MIDE lo que ocupo de verdad y se corrige.
  // Medir es mas confiable que afinar las constantes: si manana se agrega otra linea, esto
  // sigue andando solo.
  if (!enLista) ajustarColumnas(cont);        // la lista no tiene columnas que medir
  const tabla = cont.querySelector('.tabla');
  // OJO: offsetWidth/offsetHeight y NO getBoundingClientRect(). Con la pantalla girada, el
  // rect devuelve la caja ALINEADA A LA PANTALLA, o sea con el ancho y el alto cambiados de
  // lugar, y la correccion se hacia con los numeros al reves: la letra terminaba en 13,2 px
  // por un motivo inventado. offsetWidth/Height son medidas de maquetado y el transform del
  // padre no las toca. (clientWidth/clientHeight de mas arriba ya eran correctos por lo mismo.)
  const sobra = Math.min(ancho / tabla.offsetWidth, alto / tabla.offsetHeight);
  if (sobra < 1){
    const fs2 = Math.max(9, fs * sobra);
    tabla.style.setProperty('--fs', fs2.toFixed(2) + 'px');
    ['prio','fecha','desc','estado','prob','espera'].forEach(c => tabla.style.removeProperty('--w-' + c));
    if (!enLista) ajustarColumnas(cont);
  }
}

function pintarRes(){
  const el = $('res');
  if (!el) return;
  if (!VER_RES){ el.className = 'res oculto'; return; }
  const vw = Math.round(window.innerWidth), vh = Math.round(window.innerHeight);
  const sw = (window.screen && screen.width)  || 0;
  const sh = (window.screen && screen.height) || 0;
  const dpr = Math.round((window.devicePixelRatio || 1) * 100) / 100;
  const igual = sw === vw && sh === vh;
  el.innerHTML = `<b>${vw} × ${vh}</b>`
    + (igual ? 'pantalla completa' : `pantalla ${sw} × ${sh}`)
    + (dpr !== 1 ? ` · escala ${dpr}×` : '');
}

// ── ¿La TV quedo con una copia vieja? ─────────────────────────────────────────────────
// La pagina se publica sola en GitHub Pages al pushear a main, pero el navegador de la TV
// se queda con el index.html que bajo la primera vez: los DATOS se refrescan cada 30 s, el
// ARCHIVO no. Aca se baja el index.html publicado (sin cache), se le lee el
// <meta name="monitor-version"> y se compara con el de la copia que esta corriendo.
// Si no coinciden, cartel rojo. Si falla la bajada (TV sin red), no se toca nada.
const VERSION_LOCAL = (document.querySelector('meta[name="monitor-version"]') || {}).content || '';
// La version, escrita en el pie: desde el taller se mira la TV y se sabe que copia tiene,
// sin depender de que el cartel haya saltado o no. diag() le agrega despues que paso en el
// ultimo chequeo.
const AUTORECARGA   = qs.get('autorecarga') !== '0';
// Giro de la pantalla. 90 por defecto: es el lado para el que esta colgada la TV del taller,
// CONFIRMADO en la pantalla real (Elias, 23/09/2026: "estaba bien girado"). Se probo el 270
// y era el equivocado, asi que este numero ya no se toca sin mirar la TV. ?giro=270 la gira
// para el otro lado y ?giro=0 la deja horizontal, para mirarla desde una PC.
// Se aplica ya, antes de dibujar, asi pintar() mide la caja correcta.
const GIRO = (qs.get('giro') || '90').trim();
if (GIRO === '90' || GIRO === '270') document.body.className = 'giro giro' + GIRO;
// ?vista=1: ver desde una PC lo mismo que muestra la TV, pero derecho. Solo tiene sentido
// con giro; sin giro la pagina ya se lee derecha. La escala es la que hace entrar la caja
// parada (alto x ancho de ventana) en la ventana acostada: a 962x485 da 0,504.
const VISTA = qs.get('vista') === '1';
if (VISTA && GIRO !== '0') {
  document.body.classList.add('vista');
  const escalar = () => document.documentElement.style.setProperty('--esc',
    Math.min(innerWidth / innerHeight, innerHeight / innerWidth).toFixed(4));
  escalar();
  addEventListener('resize', escalar);
}
let   avisoVersion  = false;

function mostrarCartel(txt){
  const el = $('cartelVer');
  if (!el) return;
  el.textContent = txt;
  el.className = 'on';
}

// Que paso en el ULTIMO chequeo, escrito en el pie. Existe porque este aviso ya fallo dos
// veces sin dejar rastro: el catch se comia el error y desde el taller no habia forma de
// distinguir "el chequeo no corre" de "corre y dice que esta al dia" o de "la red lo rechaza".
// Ahora la TV lo cuenta sola y se lee de la misma pantalla.
function diag(txt){
  try{ $('ver').textContent = 'v' + (VERSION_LOCAL || '?') + (txt ? ' · ' + txt : ''); }catch(e){}
}
const hhmm = () => new Date().toTimeString().slice(0,5);

async function chequearVersion(){
  if (!VERSION_LOCAL) { diag('sin meta de version'); return; }
  let paso = 'arranca';
  try{
    // Se pide el archivo por su nombre EXPLICITO y no por location.pathname: si la TV quedo
    // en una URL con parametros o sin la barra final, pathname no siempre apunta al html.
    const url = 'index.html?_v=' + Date.now();
    paso = 'fetch';
    const r = await fetch(url, { cache:'no-store' });
    if (!r.ok) { diag('HTTP ' + r.status + ' ' + hhmm()); return; }
    paso = 'parse';
    const txt = await r.text();
    const doc = new DOMParser().parseFromString(txt, 'text/html');
    const meta = doc.querySelector('meta[name="monitor-version"]');
    const publicada = meta && meta.getAttribute('content');
    if (!publicada) { diag('sin meta en lo publicado ' + hhmm()); return; }
    if (publicada === VERSION_LOCAL) { diag('al dia ' + hhmm()); return; }
    diag('hay ' + publicada + ' ' + hhmm());
    if (avisoVersion) return;
    avisoVersion = true;

    // Anti-bucle: si ya se recargo por ESTA version y seguimos con la vieja, es la cache de
    // la TV y no hay nada que hacer desde acá — queda el cartel pidiendo recarga a mano.
    let intentada = null;
    try{ intentada = sessionStorage.getItem('mat_ver'); }catch(e){}
    if (!AUTORECARGA || intentada === publicada){
      mostrarCartel('⚠ Pantalla desactualizada · recargá la página con el control');
      return;
    }
    try{ sessionStorage.setItem('mat_ver', publicada); }catch(e){}
    mostrarCartel('⚠ Pantalla desactualizada · actualizando…');
    setTimeout(() => {
      const u = new URL(location.href);
      u.searchParams.set('_v', publicada);           // pisa la cache del navegador de la TV
      location.replace(u.toString());
    }, 4000);
  }catch(e){
    // Sin red se reintenta solo en el proximo chequeo, pero el motivo queda a la vista: un
    // catch mudo es lo que hizo perder dos tardes con este mismo aviso.
    diag('fallo en ' + paso + ': ' + ((e && e.message) || e) + ' ' + hhmm());
  }
}

function reloj(){
  const n = new Date();
  $('hora').textContent  = n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  $('fecha').textContent = n.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
}

pintarRes();          window.addEventListener('resize', pintarRes);
// El primer chequeo al minuto (por si la TV arranco con una copia vieja de la cache) y
// despues cada 10 minutos: es un archivo de 20 KB, no molesta a nadie.
// Primer chequeo a los 15 s y despues cada 2 minutos. Antes era 60 s y 10 minutos, y esa
// espera de hasta 10 minutos es lo que hacia parecer que el aviso "no funcionaba": el
// mecanismo andaba, pero entre que se publicaba y que la TV se enteraba pasaba un rato
// largo. El costo de chequear es UN GET del propio index.html (~30 KB); a 2 minutos son 30
// por hora, contra las 120 consultas a Supabase que la pantalla ya hace en ese mismo rato.
diag('sin chequear todavia');
setTimeout(chequearVersion, 15000);  setInterval(chequearVersion, 120000);
reloj();              setInterval(reloj, 10000);
actualizar();         setInterval(actualizar, REFRESCO);
// Si cambia el tamaño de la ventana hay que recalcular la grilla y la letra.
window.addEventListener('resize', () => { if (datos.length) pintar(); });
</script>
