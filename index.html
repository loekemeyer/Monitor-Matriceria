<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor Matricería</title>
<style>
  /* Pensado para una TV de 32" a 1920×1080 mirada de lejos: fondo oscuro, letra
     grande y NADA de scroll. Todo se mide en vh/vw, así el mismo archivo sirve
     igual en 1366×768 o en un monitor vertical sin tocar una línea. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0d1117;color:#e6edf3;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.6vh 2vw;border-bottom:.35vh solid #21262d;gap:2vw;flex:0 0 auto;
  }
  .titulo{display:flex;align-items:baseline;gap:1.4vw}
  .titulo h1{font-size:4.2vh;letter-spacing:.06em;font-weight:800}
  .titulo .sub{font-size:2.2vh;color:#8b949e}
  .reloj{font-size:4.2vh;font-weight:700;font-variant-numeric:tabular-nums}
  .reloj .fecha{display:block;font-size:1.8vh;font-weight:400;color:#8b949e;text-align:right}
  /* Lector de resolucion: APAGADO por defecto (en la TV es ruido). Se prende con ?res=1
     cuando hay que averiguar con que medida dibuja una pantalla nueva. */
  .res{
    font-size:1.7vh;font-variant-numeric:tabular-nums;color:#8b949e;text-align:right;
    background:#161b22;border:.25vh solid #30363d;border-radius:.8vh;padding:.6vh 1vw;
  }
  .res b{color:#e6edf3;font-size:2.1vh;display:block}
  .res.oculto{display:none}

  main{flex:1 1 auto;display:grid;gap:1.4vh 1.2vw;padding:1.6vh 1.2vw;min-height:0}

  .card{
    background:#161b22;border:.3vh solid #30363d;border-radius:1.4vh;
    padding:1.4vh 1.5vw;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;
  }
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:.9vh;background:var(--c,#58a6ff)}
  .card .fila1{display:flex;align-items:flex-start;justify-content:space-between;gap:1vw}
  /* El numero solo no se entiende: un "2" grande puede leerse como una cantidad.
     La etiqueta MATRIZ arriba lo aclara y casi no ocupa lugar (line-height 1). */
  .nro-caja{min-width:0}
  .nro-caja .lbl{font-size:1.5vh;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;
                 display:block;line-height:1;margin-bottom:.3vh}
  .nro{font-size:6vh;font-weight:800;line-height:1;letter-spacing:-.01em;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;flex-direction:column;align-items:flex-end;gap:.6vh;flex:0 0 auto}
  .estado{
    font-size:1.8vh;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    padding:.5vh 1vw;border-radius:99px;white-space:nowrap;
    background:var(--cb,#1f3350);color:var(--c,#58a6ff);
  }
  .quien{
    font-size:1.8vh;font-weight:700;white-space:nowrap;color:#c9d1d9;
    background:#21262d;border-radius:99px;padding:.4vh 1vw;
  }
  .sub-nombre{font-size:2.3vh;color:#8b949e;margin-top:.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Cuerpo: lo que se escribió en la planilla de Planify (problema, tarea a realizar,
     lo ya hecho) y, si la cargaron, la foto de la matriz. */
  .cuerpo{flex:1 1 auto;display:flex;gap:1vw;min-height:0;margin-top:1vh;overflow:hidden}
  .txts{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.6vh;overflow:hidden}
  .bloque{min-width:0}
  .bloque .lbl{font-size:1.5vh;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;display:block}
  .bloque .txt{
    font-size:2.3vh;line-height:1.2;color:#e6edf3;
    display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;
  }
  .bloque.hecho .txt{color:#7ee787}
  .foto{
    flex:0 0 auto;width:8.5vw;max-width:22%;height:100%;max-height:13vh;
    object-fit:cover;border-radius:.9vh;border:.25vh solid #30363d;background:#0d1117;
  }

  .fila2{display:flex;align-items:flex-end;gap:1.4vw;margin-top:1.1vh;padding-top:1vh;border-top:.25vh solid #21262d}
  .dato{display:flex;flex-direction:column;min-width:0}
  .dato .lbl{font-size:1.5vh;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .dato .val{font-size:3vh;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
  .dias .val{font-size:4.6vh;font-weight:800}
  .dias.alerta .val,.salida.vencida .val{color:#ff7b72}
  .dias.aviso  .val,.salida.hoy     .val{color:#e3b341}
  .vacio{
    grid-column:1/-1;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:2vh;color:#8b949e;font-size:4vh;text-align:center;
  }
  .vacio .emoji{font-size:9vh}

  footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:1.1vh 2vw;border-top:.35vh solid #21262d;font-size:1.9vh;color:#8b949e;gap:2vw;
  }
  .puntos{display:flex;gap:.7vw}
  .puntos i{width:1.3vh;height:1.3vh;border-radius:50%;background:#30363d;display:block}
  .puntos i.on{background:#58a6ff}
  #estadoConn.mal{color:#ff7b72;font-weight:700}

  /* ── TV POR DISPOSITIVO (Roku / Fire TV / smart TV) ───────────────────────
     Esos aparatos no abren un navegador de PC: informan una ventana chica
     (la TV del taller: 962 x 485) y despues escalan la imagen al panel. No hay
     F11 ni manera de sacarles la barra: se maneja con el control remoto. Como
     todo el diseño esta en vh, la proporcion no cambia — lo que cambia es que
     el alto disponible es la mitad y el ancho queda relativamente MAS grande
     (962/485 = 1,98 contra 1,78 de un 1920x1080).
     Entonces acá la TV pasa a 4 tarjetas (2x2, lo decide el JS) y con el doble
     de ancho por tarjeta el texto entra en menos renglones: eso es lo que deja
     subir toda la tipografia ~30% sin que nada se desborde. Se lee desde el
     fondo del taller, que es de lo que se trata. */
  @media (max-height: 600px){
    .titulo h1{font-size:5.2vh}
    .titulo .sub{font-size:2.6vh}
    .reloj{font-size:5vh}
    .reloj .fecha{font-size:2.2vh}
    .res{font-size:2vh}
    .res b{font-size:2.5vh}
    .nro{font-size:7vh}
    .estado,.quien{font-size:2.4vh}
    .sub-nombre{font-size:3vh}
    .bloque .lbl,.dato .lbl,.nro-caja .lbl{font-size:1.7vh}
    .bloque .txt{font-size:2.7vh}
    .dato .val{font-size:3.4vh}
    .dias .val{font-size:5vh}
    .foto{max-height:16vh}
    footer{font-size:2.3vh}
    .vacio{font-size:5vh}
  }
</style>
</head>
<body>
  <header>
    <div class="titulo">
      <h1>🛠️ MATRICERÍA</h1>
      <span class="sub" id="resumen">cargando…</span>
    </div>
    <div style="display:flex;align-items:center;gap:1.2vw">
      <div class="res" id="res"></div>
      <div class="reloj"><span id="hora">--:--</span><span class="fecha" id="fecha"></span></div>
    </div>
  </header>

  <main id="grilla"></main>

  <footer>
    <span id="estadoConn">Conectando…</span>
    <div class="puntos" id="puntos"></div>
    <span id="pie">Se carga desde Planify · Matricería</span>
  </footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MONITOR DE MATRICERÍA — visualizador, NO carga nada.
   Lee planify.v_matriceria_monitor del proyecto Supabase de Gestión Virgilio.
   Lo que se ve acá lo cargan Pregelj y Cornejo desde el módulo "Matricería"
   de Planify, y la TV muestra la MISMA planilla: problema, tarea a realizar,
   ya hecho, quién, HS, salida estimada y la foto si la subieron.
   Este archivo no escribe: la clave publishable sólo tiene SELECT sobre esa
   tabla y sobre el bucket de las fotos (los writes van por RPC, ver Planify).
   Parámetros por URL (opcionales):
     ?porPantalla=6   cuántas matrices entran en una pantalla (default 6)
     ?refresco=30     cada cuántos segundos vuelve a pedir los datos
     ?pagina=15       cada cuántos segundos rota si hay más de las que entran
     ?columnas=3      columnas de la grilla
     ?fotos=0         apaga las fotos (si la TV tiene poco ancho de banda)
   En una ventana baja (<=600px de alto: Roku/Fire TV/smart TV, que informan algo
   como 962x485) el default pasa solo a 4 tarjetas en 2 columnas y la hoja de
   estilo agranda toda la tipografia, para que se lea desde el fondo del taller.
   Igual se puede pisar con porPantalla y columnas.
     ?res=1           muestra el lector de resolucion (apagado por defecto)
   ══════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://hrxfctzncixxqmpfhskv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BqpAgZH6ty-9wft10_YMhw_0rcIPuWT'; // clave PÚBLICA de solo lectura
const BUCKET_FOTOS = 'planify_matriceria';

const qs         = new URLSearchParams(location.search);
const num        = (k, def) => { const v = parseInt(qs.get(k), 10); return Number.isFinite(v) && v > 0 ? v : def; };
// Ventana baja = TV por dispositivo (ver el @media del CSS). Menos tarjetas y mas grandes.
const VENT_BAJA  = window.innerHeight <= 600;
const POR_PANT   = num('porPantalla', VENT_BAJA ? 4 : 6);
const REFRESCO   = Math.max(5, num('refresco', 30)) * 1000;
const PAGINA     = Math.max(5, num('pagina', 15)) * 1000;
const COLUMNAS   = num('columnas', VENT_BAJA ? 2 : 3);
const CON_FOTOS  = qs.get('fotos') !== '0';
const VER_RES    = qs.get('res')   === '1';   // apagado por defecto: en la TV es ruido

const ESTADOS = {
  ingresada:  { txt:'Ingresada',  c:'#58a6ff', cb:'#132c4d' },
  en_proceso: { txt:'En proceso', c:'#e3b341', cb:'#3a2f10' },
  esperando:  { txt:'Esperando',  c:'#ff7b72', cb:'#3d1d1b' },
  terminada:  { txt:'Terminada',  c:'#3fb950', cb:'#12301a' }
};

let datos = [];        // última respuesta buena
let pagina = 0;
let ultimaOk = null;   // cuándo trajo datos por última vez
const fotos = new Map(); // foto_path -> objectURL | 'cargando' | 'error'

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fecha = d => { if (!d) return '—'; const [y,m,dd] = String(d).split('-'); return dd+'/'+m; };
// Coma decimal y sin ceros de relleno: 3.50 -> "3,5"
const hsTxt = v => (v == null || v === '' || !Number.isFinite(Number(v))) ? '' : String(Number(v)).replace('.', ',');

async function traer(){
  // estado=neq.terminada: el monitor muestra lo que está EN el taller. Cuando la matriz se
  // termina (o se cierra su tarea en Planify) desaparece sola de la TV.
  const url = SUPABASE_URL + '/rest/v1/v_matriceria_monitor'
            + '?select=*&estado=neq.terminada&order=dias_demora.desc,fecha_ingreso.asc';
  const r = await fetch(url, { headers:{ apikey:SUPABASE_KEY, 'Accept-Profile':'planify' }, cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

// La foto vive en un bucket PRIVADO: no se puede poner la URL directa en el <img>, hay que
// pedirla con la clave. Se baja UNA vez por archivo y queda cacheada; si la cambian, el
// path cambia (lleva la fecha en el nombre) y se baja la nueva. Si falla, no se muestra
// foto y la tarjeta sigue andando: en una TV nunca se rompe la pantalla por una imagen.
async function traerFotos(){
  if (!CON_FOTOS) return;
  for (const m of datos){
    const p = m.foto_path;
    if (!p || fotos.has(p)) continue;
    fotos.set(p, 'cargando');
    try{
      const url = SUPABASE_URL + '/storage/v1/object/' + BUCKET_FOTOS + '/'
                + String(p).split('/').map(encodeURIComponent).join('/');
      const r = await fetch(url, { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      fotos.set(p, URL.createObjectURL(await r.blob()));
      pintar();
    }catch(e){ fotos.set(p, 'error'); }
  }
}

async function actualizar(){
  try{
    const nuevos = await traer();
    // Sólo se pisa lo que se ve si la respuesta vino bien: un corte de red no tiene que
    // dejar la TV en blanco, se sigue viendo lo último que se supo.
    datos = Array.isArray(nuevos) ? nuevos : [];
    ultimaOk = new Date();
    $('estadoConn').textContent = 'En línea · ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    $('estadoConn').className = '';
    if (pagina * POR_PANT >= datos.length) pagina = 0;
    pintar();
    traerFotos();
  }catch(e){
    $('estadoConn').textContent = 'SIN CONEXIÓN' + (ultimaOk ? ' · último dato ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '');
    $('estadoConn').className = 'mal';
  }
}

// El "hoy" sale del SERVIDOR, no del reloj de la TV: la vista calcula dias_demora en hora
// Argentina, así que para una matriz que sigue en el taller (sin fecha_salida)
// fecha_ingreso + dias_demora ES la fecha de hoy del servidor. Con eso se decide si la
// salida estimada está vencida, sin que una PC con la fecha mal puesta pueda mentir.
function hoyServidor(){
  for (const m of datos){
    if (m.fecha_ingreso && !m.fecha_salida && Number.isFinite(Number(m.dias_demora))){
      const d = new Date(String(m.fecha_ingreso) + 'T00:00:00');
      if (!isNaN(d)){ d.setDate(d.getDate() + Number(m.dias_demora)); return d; }
    }
  }
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

function bloque(lbl, txt, lineas, clase){
  if (!txt) return '';
  return `<div class="bloque ${clase||''}"><span class="lbl">${lbl}</span>`
       + `<div class="txt" style="-webkit-line-clamp:${lineas}">${esc(txt)}</div></div>`;
}

function tarjeta(m, hoy){
  const e = ESTADOS[m.estado] || ESTADOS.ingresada;
  const d = Number(m.dias_demora || 0);
  const clase = d >= 7 ? 'alerta' : (d >= 3 ? 'aviso' : '');

  const problema = String(m.motivo || '').trim();
  const tarea    = String(m.tarea  || '').trim();
  const hecho    = String(m.tarea_realizada || '').trim();
  const obs      = String(m.observaciones   || '').trim();
  // Las observaciones del alta van pegadas al problema: es más contexto de lo mismo y
  // así no se come una línea entera de la tarjeta.
  const problemaTxt = obs ? (problema ? problema + ' · ' + obs : obs) : problema;
  // Cuando no hay tarea cargada, el problema se puede estirar; cuando sí, cada uno 2 líneas.
  const lineasProb = tarea ? 2 : 3;

  const foto = fotos.get(m.foto_path);
  const imgHtml = (CON_FOTOS && foto && foto !== 'cargando' && foto !== 'error')
    ? `<img class="foto" src="${esc(foto)}" alt="">` : '';

  let salidaHtml = '';
  if (m.salida_estimada){
    const s = new Date(String(m.salida_estimada) + 'T00:00:00');
    const difDias = isNaN(s) ? null : Math.round((s - hoy) / 86400000);
    const cs = difDias == null ? '' : (difDias < 0 ? 'vencida' : (difDias === 0 ? 'hoy' : ''));
    salidaHtml = `<div class="dato salida ${cs}"><span class="lbl">Salida est.</span><span class="val">${fecha(m.salida_estimada)}</span></div>`;
  }
  const hs = hsTxt(m.hs);
  const hsHtml = hs ? `<div class="dato"><span class="lbl">HS</span><span class="val">${esc(hs)}</span></div>` : '';
  const quien = String(m.quien || '').trim();

  return `<div class="card" style="--c:${e.c};--cb:${e.cb}">
    <div class="fila1">
      <div class="nro-caja">
        <span class="lbl">Matriz</span>
        <div class="nro">${esc(m.numero_matriz)}</div>
      </div>
      <div class="chips">
        <div class="estado">${e.txt}</div>
        ${quien ? `<div class="quien">👤 ${esc(quien)}</div>` : ''}
      </div>
    </div>
    ${m.nombre_matriz ? `<div class="sub-nombre">${esc(m.nombre_matriz)}</div>` : ''}
    <div class="cuerpo">
      <div class="txts">
        ${bloque('Problema', problemaTxt, lineasProb)}
        ${bloque('Tarea a realizar', tarea, 2)}
        ${bloque('Ya hecho', hecho, 1, 'hecho')}
      </div>
      ${imgHtml}
    </div>
    <div class="fila2">
      <div class="dato"><span class="lbl">Ingresó</span><span class="val">${fecha(m.fecha_ingreso)}</span></div>
      <div class="dato dias ${clase}"><span class="lbl">Demora</span><span class="val">${d} d</span></div>
      ${salidaHtml}${hsHtml}
    </div>
  </div>`;
}

// Ningun renglon cortado a la mitad: si un bloque de texto no entra ENTERO en la tarjeta,
// se saca. El orden del HTML es el de importancia (problema > tarea > ya hecho), asi que lo
// que se cae es siempre lo menos importante. Vale para cualquier resolucion: en una TV mas
// chica se muestra menos, pero nunca media linea.
function podarBloques(){
  document.querySelectorAll('.card .txts').forEach(txts => {
    const limite = txts.getBoundingClientRect().bottom;
    const hijos  = [...txts.children];
    // De ABAJO hacia arriba y cortando en el primero que entra: asi se cae siempre lo
    // menos importante. (Recorriendolo al reves se podia borrar la tarea y dejar el
    // "ya hecho", que es peor.) El indice 0 -el problema- no se saca nunca: una tarjeta
    // sin problema no le dice nada a nadie.
    for (let i = hijos.length - 1; i >= 1; i--){
      if (hijos[i].getBoundingClientRect().bottom > limite - 1) hijos[i].remove();
      else break;
    }
  });
}

function pintar(){
  const grilla = $('grilla');
  const filas  = Math.max(1, Math.ceil(POR_PANT / COLUMNAS));
  grilla.style.gridTemplateColumns = `repeat(${COLUMNAS},1fr)`;
  grilla.style.gridTemplateRows    = `repeat(${filas},1fr)`;

  const paginas = Math.max(1, Math.ceil(datos.length / POR_PANT));
  if (pagina >= paginas) pagina = 0;
  const trozo = datos.slice(pagina * POR_PANT, pagina * POR_PANT + POR_PANT);
  const hoy = hoyServidor();

  $('resumen').textContent = datos.length
    ? datos.length + (datos.length === 1 ? ' matriz en el taller' : ' matrices en el taller')
    : 'sin matrices en el taller';

  grilla.innerHTML = trozo.length
    ? trozo.map(m => tarjeta(m, hoy)).join('')
    : '<div class="vacio"><span class="emoji">✅</span><span>No hay ninguna matriz en el taller</span></div>';

  podarBloques();
  // Segunda pasada tras el reflow: en pantallas chicas el redondeo deja algun bloque
  // asomando por un pixel despues de la primera medicion.
  requestAnimationFrame(podarBloques);

  $('puntos').innerHTML = paginas > 1
    ? Array.from({length:paginas}, (_,i) => `<i class="${i===pagina?'on':''}"></i>`).join('')
    : '';
  $('pie').textContent = paginas > 1
    ? `Pantalla ${pagina+1} de ${paginas} · se carga desde Planify → Matricería`
    : 'Se carga desde Planify → Matricería';
}

// Resolucion REAL con la que se esta dibujando. Se muestran las dos medidas porque no son
// lo mismo y el diseño depende de la primera: "ventana" es el area de la pagina (lo que
// mide vh/vw, y baja si el navegador no esta en pantalla completa o tiene zoom) y
// "pantalla" es lo que dice el monitor. Si difieren, antes de tocar el CSS hay que ver si
// falta un F11 o sobra un zoom.
function pintarRes(){
  const el = $('res');
  if (!el) return;
  if (!VER_RES){ el.className = 'res oculto'; return; }
  const vw = Math.round(window.innerWidth), vh = Math.round(window.innerHeight);
  const sw = (window.screen && screen.width)  || 0;
  const sh = (window.screen && screen.height) || 0;
  const dpr = Math.round((window.devicePixelRatio || 1) * 100) / 100;
  const igual = sw === vw && sh === vh;
  el.innerHTML = `<b>${vw} × ${vh}</b>`
    + (igual ? 'pantalla completa' : `pantalla ${sw} × ${sh}`)
    + (dpr !== 1 ? ` · escala ${dpr}×` : '');
}

function reloj(){
  const n = new Date();
  $('hora').textContent  = n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  $('fecha').textContent = n.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
}

pintarRes();          window.addEventListener('resize', pintarRes);
reloj();              setInterval(reloj, 10000);
actualizar();         setInterval(actualizar, REFRESCO);
// Rotación: sólo si hay MÁS matrices en el taller de las que entran en una pantalla.
setInterval(() => {
  const paginas = Math.ceil(datos.length / POR_PANT);
  if (paginas > 1){ pagina = (pagina + 1) % paginas; pintar(); }
}, PAGINA);
</script>
</body>
</html>
