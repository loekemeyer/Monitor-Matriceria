<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- VERSION DE LA PAGINA. Se compara con la del index.html publicado en GitHub Pages para
     avisar cuando la TV quedo con una copia vieja en cache. SUBIRLA EN CADA COMMIT que
     toque este archivo: si no se sube, el aviso nunca salta. -->
<meta name="monitor-version" content="2026-09-23.7">
<title>Monitor Matricería</title>
<style>
  /* Pensado para una TV de 32" a 1920×1080 mirada de lejos: fondo oscuro, letra
     grande y NADA de scroll. Todo se mide en vh/vw, así el mismo archivo sirve
     igual en 1366×768 o en un monitor vertical sin tocar una línea. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0d1117;color:#e6edf3;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.6vh 2vw;border-bottom:.35vh solid #21262d;gap:2vw;flex:0 0 auto;
  }
  .titulo{display:flex;align-items:baseline;gap:1.4vw}
  .titulo h1{font-size:4.2vh;letter-spacing:.06em;font-weight:800}
  .titulo .sub{font-size:2.2vh;color:#8b949e}
  .reloj{font-size:4.2vh;font-weight:700;font-variant-numeric:tabular-nums}
  .reloj .fecha{display:block;font-size:1.8vh;font-weight:400;color:#8b949e;text-align:right}
  /* Lector de resolucion: APAGADO por defecto (en la TV es ruido). Se prende con ?res=1
     cuando hay que averiguar con que medida dibuja una pantalla nueva. */
  .res{
    font-size:1.7vh;font-variant-numeric:tabular-nums;color:#8b949e;text-align:right;
    background:#161b22;border:.25vh solid #30363d;border-radius:.8vh;padding:.6vh 1vw;
  }
  .res b{color:#e6edf3;font-size:2.1vh;display:block}
  .res.oculto{display:none}

  /* Flex en vez de grid: con la ultima fila incompleta (10 matrices en 4 columnas) las que
     quedan se CENTRAN en vez de dejar un hueco a la derecha. Las medidas de cada tarjeta
     las calcula el JS para que entren todas. */
  main{flex:1 1 auto;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
       gap:1.4vh 1.2vw;padding:1.6vh 1.2vw;min-height:0;overflow:hidden}

  /* La tarjeta se mide en EM sobre --fs, que calcula el JS segun el tamaño de la celda:
     asi, con mas matrices en pantalla, TODO (numero, etiquetas, textos) se achica junto y
     en proporcion. No hay tamaños atados a la pantalla aca adentro. */
  .card{
    font-size:var(--fs,14px);flex:0 0 var(--cw,auto);height:var(--ch,auto);
    background:#161b22;border:1px solid #30363d;border-radius:.6em;
    padding:.75em .9em;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;
  }
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:.4em;background:var(--c,#58a6ff)}
  .card .fila1{display:flex;align-items:flex-start;justify-content:space-between;gap:.6em}
  /* El numero solo no se entiende: un "2" grande puede leerse como una cantidad.
     La etiqueta MATRIZ arriba lo aclara y casi no ocupa lugar (line-height 1). */
  .nro-caja{min-width:0}
  .nro-caja .lbl{font-size:.6em;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;
                 display:block;line-height:1;margin-bottom:.15em}
  .nro{font-size:2.6em;font-weight:800;line-height:1;letter-spacing:-.01em;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Matriz sin numero (experimental, muestra, nueva): en el campo "numero" escriben el
     NOMBRE. Entonces el lugar del numero dice S/N -mas chico, porque no identifica nada-
     y lo que escribieron va al renglon del nombre, que es lo que si identifica. */
  .nro.sn{font-size:1.8em;color:#8b949e}
  .chips{display:flex;flex-direction:column;align-items:flex-end;gap:.3em;flex:0 0 auto}
  .estado{
    font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    padding:.25em .8em;border-radius:99px;white-space:nowrap;
    background:var(--cb,#1f3350);color:var(--c,#58a6ff);
  }
  .quien{
    font-size:.72em;font-weight:700;white-space:nowrap;color:#c9d1d9;
    background:#21262d;border-radius:99px;padding:.22em .8em;
  }
  .sub-nombre{font-size:1em;color:#8b949e;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Cuerpo: lo que se escribió en la planilla de Planify (problema, tarea a realizar,
     lo ya hecho) y, si la cargaron, la foto de la matriz. */
  .cuerpo{flex:1 1 auto;display:flex;gap:.6em;min-height:0;margin-top:.5em;overflow:hidden}
  .txts{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.3em;overflow:hidden}
  .bloque{min-width:0}
  .bloque .lbl{font-size:.6em;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;display:block;line-height:1.1}
  .bloque .txt{
    font-size:1em;line-height:1.2;color:#e6edf3;
    display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;
  }
  .bloque.hecho .txt{color:#7ee787}
  .foto{
    flex:0 0 auto;width:6em;max-width:28%;height:100%;max-height:5.5em;
    object-fit:cover;border-radius:.4em;border:1px solid #30363d;background:#0d1117;
  }

  .fila2{display:flex;align-items:flex-end;gap:.9em;margin-top:.5em;padding-top:.45em;border-top:1px solid #21262d}
  .dato{display:flex;flex-direction:column;min-width:0}
  .dato .lbl{font-size:.6em;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;line-height:1.1}
  .dato .val{font-size:1.25em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
  .dias .val{font-size:1.9em;font-weight:800}
  .dias.alerta .val,.salida.vencida .val{color:#ff7b72}
  .dias.aviso  .val,.salida.hoy     .val{color:#e3b341}
  .vacio{
    flex:1 1 100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:2vh;color:#8b949e;font-size:4vh;text-align:center;
  }
  .vacio .emoji{font-size:9vh}

  footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:1.1vh 2vw;border-top:.35vh solid #21262d;font-size:1.9vh;color:#8b949e;gap:2vw;
  }
  #estadoConn.mal{color:#ff7b72;font-weight:700}

  /* Cartel de version vieja: rojo brillante, letras blancas, arriba de todo. Empuja el
     tablero hacia abajo en vez de taparlo (es un flex item mas), asi no esconde ninguna
     matriz. Late despacio para que se note desde lejos sin marear. */
  #cartelVer{
    display:none;flex:0 0 auto;background:#e5001d;color:#fff;text-align:center;
    font-size:3.2vh;font-weight:800;letter-spacing:.04em;padding:1.4vh 2vw;
    text-transform:uppercase;animation:latir 2.4s ease-in-out infinite;
  }
  #cartelVer.on{display:block}
  @keyframes latir{0%,100%{background:#e5001d}50%{background:#ff2a3d}}

</style>
</head>
<body>
  <div id="cartelVer"></div>
  <header>
    <div class="titulo">
      <h1>🛠️ MATRICERÍA</h1>
      <span class="sub" id="resumen">cargando…</span>
    </div>
    <div style="display:flex;align-items:center;gap:1.2vw">
      <div class="res" id="res"></div>
      <div class="reloj"><span id="hora">--:--</span><span class="fecha" id="fecha"></span></div>
    </div>
  </header>

  <main id="grilla"></main>

  <footer>
    <span id="estadoConn">Conectando…</span>
    <span id="pie">Se carga desde Planify · Matricería</span>
  </footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MONITOR DE MATRICERÍA — visualizador, NO carga nada.
   Lee planify.v_matriceria_monitor del proyecto Supabase de Gestión Virgilio.
   Lo que se ve acá lo cargan Pregelj y Cornejo desde el módulo "Matricería"
   de Planify, y la TV muestra la MISMA planilla: problema, tarea a realizar,
   ya hecho, quién, HS, salida estimada y la foto si la subieron.
   Este archivo no escribe: la clave publishable sólo tiene SELECT sobre esa
   tabla y sobre el bucket de las fotos (los writes van por RPC, ver Planify).
   Parámetros por URL (opcionales):
     ?refresco=30     cada cuántos segundos vuelve a pedir los datos
     ?columnas=4      fuerza las columnas (por defecto las calcula sola)
     ?fotos=0         apaga las fotos (si la TV tiene poco ancho de banda)
   TODAS las matrices del taller entran SIEMPRE en una sola pantalla: no hay
   carrusel. La grilla y el tamaño de letra se calculan segun cuantas haya, asi
   que con mas matrices las tarjetas se achican en vez de esconderse.
     ?res=1           muestra el lector de resolucion (apagado por defecto)
     ?autorecarga=0   deja el cartel rojo pero NO recarga sola la pagina
   ══════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://hrxfctzncixxqmpfhskv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BqpAgZH6ty-9wft10_YMhw_0rcIPuWT'; // clave PÚBLICA de solo lectura
const BUCKET_FOTOS = 'planify_matriceria';

const qs         = new URLSearchParams(location.search);
const num        = (k, def) => { const v = parseInt(qs.get(k), 10); return Number.isFinite(v) && v > 0 ? v : def; };
const REFRESCO   = Math.max(5, num('refresco', 30)) * 1000;
const COLUMNAS   = num('columnas', 0);   // 0 = las calcula sola segun cuantas matrices hay
const CON_FOTOS  = qs.get('fotos') !== '0';
const VER_RES    = qs.get('res')   === '1';   // apagado por defecto: en la TV es ruido

const ESTADOS = {
  ingresada:  { txt:'Ingresada',  c:'#58a6ff', cb:'#132c4d' },
  en_proceso: { txt:'En proceso', c:'#e3b341', cb:'#3a2f10' },
  esperando:  { txt:'Esperando',  c:'#ff7b72', cb:'#3d1d1b' },
  terminada:  { txt:'Terminada',  c:'#3fb950', cb:'#12301a' }
};

let datos = [];        // última respuesta buena
let ultimaOk = null;   // cuándo trajo datos por última vez
const fotos = new Map(); // foto_path -> objectURL | 'cargando' | 'error'

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fecha = d => { if (!d) return '—'; const [y,m,dd] = String(d).split('-'); return dd+'/'+m; };
// Coma decimal y sin ceros de relleno: 3.50 -> "3,5"
const hsTxt = v => (v == null || v === '' || !Number.isFinite(Number(v))) ? '' : String(Number(v)).replace('.', ',');

async function traer(){
  // estado=neq.terminada: el monitor muestra lo que está EN el taller. Cuando la matriz se
  // termina (o se cierra su tarea en Planify) desaparece sola de la TV.
  const url = SUPABASE_URL + '/rest/v1/v_matriceria_monitor'
            + '?select=*&estado=neq.terminada&order=dias_demora.desc,fecha_ingreso.asc';
  const r = await fetch(url, { headers:{ apikey:SUPABASE_KEY, 'Accept-Profile':'planify' }, cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

// La foto vive en un bucket PRIVADO: no se puede poner la URL directa en el <img>, hay que
// pedirla con la clave. Se baja UNA vez por archivo y queda cacheada; si la cambian, el
// path cambia (lleva la fecha en el nombre) y se baja la nueva. Si falla, no se muestra
// foto y la tarjeta sigue andando: en una TV nunca se rompe la pantalla por una imagen.
async function traerFotos(){
  if (!CON_FOTOS) return;
  for (const m of datos){
    const p = m.foto_path;
    if (!p || fotos.has(p)) continue;
    fotos.set(p, 'cargando');
    try{
      const url = SUPABASE_URL + '/storage/v1/object/' + BUCKET_FOTOS + '/'
                + String(p).split('/').map(encodeURIComponent).join('/');
      const r = await fetch(url, { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      fotos.set(p, URL.createObjectURL(await r.blob()));
      pintar();
    }catch(e){ fotos.set(p, 'error'); }
  }
}

async function actualizar(){
  try{
    const nuevos = await traer();
    // Sólo se pisa lo que se ve si la respuesta vino bien: un corte de red no tiene que
    // dejar la TV en blanco, se sigue viendo lo último que se supo.
    datos = Array.isArray(nuevos) ? nuevos : [];
    ultimaOk = new Date();
    $('estadoConn').textContent = 'En línea · ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    $('estadoConn').className = '';
    pintar();
    traerFotos();
  }catch(e){
    $('estadoConn').textContent = 'SIN CONEXIÓN' + (ultimaOk ? ' · último dato ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '');
    $('estadoConn').className = 'mal';
  }
}

// El "hoy" sale del SERVIDOR, no del reloj de la TV: la vista calcula dias_demora en hora
// Argentina, así que para una matriz que sigue en el taller (sin fecha_salida)
// fecha_ingreso + dias_demora ES la fecha de hoy del servidor. Con eso se decide si la
// salida estimada está vencida, sin que una PC con la fecha mal puesta pueda mentir.
function hoyServidor(){
  for (const m of datos){
    if (m.fecha_ingreso && !m.fecha_salida && Number.isFinite(Number(m.dias_demora))){
      const d = new Date(String(m.fecha_ingreso) + 'T00:00:00');
      if (!isNaN(d)){ d.setDate(d.getDate() + Number(m.dias_demora)); return d; }
    }
  }
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

function bloque(lbl, txt, lineas, clase){
  if (!txt) return '';
  return `<div class="bloque ${clase||''}"><span class="lbl">${lbl}</span>`
       + `<div class="txt" style="-webkit-line-clamp:${lineas}">${esc(txt)}</div></div>`;
}

// Lo que se escribe en "Numero de matriz" no siempre es un numero: una matriz experimental,
// una muestra o una recien hecha todavia no lo tiene, y ahi cargan el NOMBRE. Se toma como
// numero solo si son digitos (con una letra al final: 12A). Cualquier otra cosa es el nombre.
function esNumeroDeMatriz(v){ return /^\d+\s*[a-zA-Z]?$/.test(String(v || '').trim()); }

function tarjeta(m, hoy){
  const e = ESTADOS[m.estado] || ESTADOS.ingresada;
  const d = Number(m.dias_demora || 0);
  const clase = d >= 7 ? 'alerta' : (d >= 3 ? 'aviso' : '');

  const problema = String(m.motivo || '').trim();
  const tarea    = String(m.tarea  || '').trim();
  const hecho    = String(m.tarea_realizada || '').trim();
  const obs      = String(m.observaciones   || '').trim();
  // Las observaciones del alta van pegadas al problema: es más contexto de lo mismo y
  // así no se come una línea entera de la tarjeta.
  const problemaTxt = obs ? (problema ? problema + ' · ' + obs : obs) : problema;
  // Cuando no hay tarea cargada, el problema se puede estirar; cuando sí, cada uno 2 líneas.
  const lineasProb = tarea ? 2 : 3;

  const foto = fotos.get(m.foto_path);
  const imgHtml = (CON_FOTOS && foto && foto !== 'cargando' && foto !== 'error')
    ? `<img class="foto" src="${esc(foto)}" alt="">` : '';

  let salidaHtml = '';
  if (m.salida_estimada){
    const s = new Date(String(m.salida_estimada) + 'T00:00:00');
    const difDias = isNaN(s) ? null : Math.round((s - hoy) / 86400000);
    const cs = difDias == null ? '' : (difDias < 0 ? 'vencida' : (difDias === 0 ? 'hoy' : ''));
    salidaHtml = `<div class="dato salida ${cs}"><span class="lbl">Salida est.</span><span class="val">${fecha(m.salida_estimada)}</span></div>`;
  }
  const hs = hsTxt(m.hs);
  const hsHtml = hs ? `<div class="dato"><span class="lbl">HS</span><span class="val">${esc(hs)}</span></div>` : '';
  const quien = String(m.quien || '').trim();

  const cargado   = String(m.numero_matriz || '').trim();
  const conNumero = esNumeroDeMatriz(cargado);
  // Sin numero: lo cargado es el nombre. Si ademas vino nombre_matriz del maestro y es otro,
  // se muestra ese y lo escrito queda de subtitulo, para no perder ninguno de los dos.
  const nombreMatriz = conNumero
    ? String(m.nombre_matriz || '').trim()
    : (String(m.nombre_matriz || '').trim() || cargado);

  return `<div class="card" style="--c:${e.c};--cb:${e.cb}">
    <div class="fila1">
      <div class="nro-caja">
        <span class="lbl">Matriz</span>
        <div class="nro${conNumero ? '' : ' sn'}">${conNumero ? esc(cargado) : 'S/N'}</div>
      </div>
      <div class="chips">
        <div class="estado">${e.txt}</div>
        ${quien ? `<div class="quien">👤 ${esc(quien)}</div>` : ''}
      </div>
    </div>
    ${nombreMatriz ? `<div class="sub-nombre">${esc(nombreMatriz)}</div>` : ''}
    <div class="cuerpo">
      <div class="txts">
        ${bloque('Problema', problemaTxt, lineasProb)}
        ${bloque('Tarea a realizar', tarea, 2)}
        ${bloque('Ya hecho', hecho, 1, 'hecho')}
      </div>
      ${imgHtml}
    </div>
    <div class="fila2">
      <div class="dato"><span class="lbl">Ingresó</span><span class="val">${fecha(m.fecha_ingreso)}</span></div>
      <div class="dato dias ${clase}"><span class="lbl">Demora</span><span class="val">${d} d</span></div>
      ${salidaHtml}${hsHtml}
    </div>
  </div>`;
}

// Ningun renglon cortado a la mitad: si un bloque de texto no entra ENTERO en la tarjeta,
// se saca. El orden del HTML es el de importancia (problema > tarea > ya hecho), asi que lo
// que se cae es siempre lo menos importante. Vale para cualquier resolucion: en una TV mas
// chica se muestra menos, pero nunca media linea.
function podarBloques(){
  document.querySelectorAll('.card .txts').forEach(txts => {
    const limite = txts.getBoundingClientRect().bottom;
    const hijos  = [...txts.children];
    // De ABAJO hacia arriba y cortando en el primero que entra: asi se cae siempre lo
    // menos importante. (Recorriendolo al reves se podia borrar la tarea y dejar el
    // "ya hecho", que es peor.) El indice 0 -el problema- no se saca nunca: una tarjeta
    // sin problema no le dice nada a nadie.
    for (let i = hijos.length - 1; i >= 1; i--){
      if (hijos[i].getBoundingClientRect().bottom > limite - 1) hijos[i].remove();
      else break;
    }
    // El problema no se saca nunca, pero si el solo no entra (tarjeta chica o texto largo)
    // se le van recortando renglones hasta que entre. Mejor el problema cortado con puntos
    // suspensivos que medio renglon tapado por el borde.
    const primero = txts.firstElementChild;
    const txt = primero && primero.querySelector('.txt');
    if (txt){
      let lineas = parseInt(txt.style.webkitLineClamp, 10) || 3;
      while (lineas > 1 && primero.getBoundingClientRect().bottom > limite - 1){
        lineas--;
        txt.style.webkitLineClamp = String(lineas);
      }
    }
  });
}

// Una tarjeta llena mide 13 em de alto (numero + nombre + un bloque de texto + el pie) y
// necesita 22 em de ancho para que el texto no se parta en migajas. De ahi salen las dos
// divisiones de abajo: con el alto y el ancho de una celda, cual es la letra mas grande
// que entra.
const EM_ALTO = 13, EM_ANCHO = 22;
const letraQueEntra = (cw, ch) => Math.min(ch / EM_ALTO, cw / EM_ANCHO);

// Elige filas x columnas para que TODAS las matrices entren en una sola pantalla con la
// letra MAS GRANDE posible. No hay carrusel: si hay mas matrices, las tarjetas se achican.
function mejorGrilla(n, ancho, alto, gx, gy){
  let mejor = { cols:1, filas:n, letra:0 };
  for (let cols = 1; cols <= n; cols++){
    const filas = Math.ceil(n / cols);
    const cw = (ancho - gx * (cols  - 1)) / cols;
    const ch = (alto  - gy * (filas - 1)) / filas;
    if (cw <= 0 || ch <= 0) continue;
    const letra = letraQueEntra(cw, ch);
    if (letra > mejor.letra) mejor = { cols, filas, letra };
  }
  return mejor;
}

function pintar(){
  const grilla = $('grilla');
  const n   = datos.length;
  const hoy = hoyServidor();

  $('resumen').textContent = n
    ? n + (n === 1 ? ' matriz en el taller' : ' matrices en el taller')
    : 'sin matrices en el taller';

  if (!n){
    grilla.style.removeProperty('--cw');
    grilla.style.removeProperty('--ch');
    grilla.innerHTML = '<div class="vacio"><span class="emoji">✅</span><span>No hay ninguna matriz en el taller</span></div>';
    return;
  }

  // Tamaño real disponible para las tarjetas (ya descontados header, pie y padding).
  const cs = getComputedStyle(grilla);
  const gy = parseFloat(cs.rowGap)    || 0;
  const gx = parseFloat(cs.columnGap) || 0;
  const ancho = grilla.clientWidth  - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight)  || 0);
  const alto  = grilla.clientHeight - (parseFloat(cs.paddingTop)  || 0) - (parseFloat(cs.paddingBottom) || 0);

  const g     = COLUMNAS ? { cols: COLUMNAS, filas: Math.ceil(n / COLUMNAS) }
                         : mejorGrilla(n, ancho, alto, gx, gy);
  const cw    = (ancho - gx * (g.cols  - 1)) / g.cols;
  const ch    = (alto  - gy * (g.filas - 1)) / g.filas;

  // La letra sale del tamaño de la celda, no de la pantalla: una tarjeta chica trae letra
  // chica, y todo lo de adentro (que esta en em) la acompaña. El piso de 9px es para que
  // con muchisimas matrices siga siendo texto y no una mancha; lo que no entre lo saca
  // podarBloques().
  // Piso de 9 px: con muchisimas matrices tiene que seguir siendo texto y no una mancha.
  // Lo que no entre a esa letra lo recorta podarBloques().
  const fs = Math.max(9, letraQueEntra(cw, ch));
  grilla.style.setProperty('--fs', fs.toFixed(2) + 'px');
  // Se redondea para abajo: un pixel de mas y el navegador manda una tarjeta a otra fila.
  grilla.style.setProperty('--cw', Math.floor(cw) + 'px');
  grilla.style.setProperty('--ch', Math.floor(ch) + 'px');

  grilla.innerHTML = datos.map(m => tarjeta(m, hoy)).join('');

  podarBloques();
  // Segunda pasada tras el reflow: en pantallas chicas el redondeo deja algun bloque
  // asomando por un pixel despues de la primera medicion.
  requestAnimationFrame(podarBloques);
}

function pintarRes(){
  const el = $('res');
  if (!el) return;
  if (!VER_RES){ el.className = 'res oculto'; return; }
  const vw = Math.round(window.innerWidth), vh = Math.round(window.innerHeight);
  const sw = (window.screen && screen.width)  || 0;
  const sh = (window.screen && screen.height) || 0;
  const dpr = Math.round((window.devicePixelRatio || 1) * 100) / 100;
  const igual = sw === vw && sh === vh;
  el.innerHTML = `<b>${vw} × ${vh}</b>`
    + (igual ? 'pantalla completa' : `pantalla ${sw} × ${sh}`)
    + (dpr !== 1 ? ` · escala ${dpr}×` : '');
}

// ── ¿La TV quedo con una copia vieja? ─────────────────────────────────────────────────
// La pagina se publica sola en GitHub Pages al pushear a main, pero el navegador de la TV
// se queda con el index.html que bajo la primera vez: los DATOS se refrescan cada 30 s, el
// ARCHIVO no. Aca se baja el index.html publicado (sin cache), se le lee el
// <meta name="monitor-version"> y se compara con el de la copia que esta corriendo.
// Si no coinciden, cartel rojo. Si falla la bajada (TV sin red), no se toca nada.
const VERSION_LOCAL = (document.querySelector('meta[name="monitor-version"]') || {}).content || '';
const AUTORECARGA   = qs.get('autorecarga') !== '0';
let   avisoVersion  = false;

function mostrarCartel(txt){
  const el = $('cartelVer');
  if (!el) return;
  el.textContent = txt;
  el.className = 'on';
}

async function chequearVersion(){
  if (!VERSION_LOCAL) return;                       // sin meta no hay nada que comparar
  try{
    const r = await fetch(location.pathname + '?_v=' + Date.now(), { cache:'no-store' });
    if (!r.ok) return;
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const meta = doc.querySelector('meta[name="monitor-version"]');
    const publicada = meta && meta.getAttribute('content');
    if (!publicada || publicada === VERSION_LOCAL) return;   // al dia (o no se pudo leer)
    if (avisoVersion) return;
    avisoVersion = true;

    // Anti-bucle: si ya se recargo por ESTA version y seguimos con la vieja, es la cache de
    // la TV y no hay nada que hacer desde acá — queda el cartel pidiendo recarga a mano.
    let intentada = null;
    try{ intentada = sessionStorage.getItem('mat_ver'); }catch(e){}
    if (!AUTORECARGA || intentada === publicada){
      mostrarCartel('⚠ Pantalla desactualizada · recargá la página con el control');
      return;
    }
    try{ sessionStorage.setItem('mat_ver', publicada); }catch(e){}
    mostrarCartel('⚠ Pantalla desactualizada · actualizando…');
    setTimeout(() => {
      const u = new URL(location.href);
      u.searchParams.set('_v', publicada);           // pisa la cache del navegador de la TV
      location.replace(u.toString());
    }, 4000);
  }catch(e){ /* sin red: se reintenta en el proximo chequeo */ }
}

function reloj(){
  const n = new Date();
  $('hora').textContent  = n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  $('fecha').textContent = n.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
}

pintarRes();          window.addEventListener('resize', pintarRes);
// El primer chequeo al minuto (por si la TV arranco con una copia vieja de la cache) y
// despues cada 10 minutos: es un archivo de 20 KB, no molesta a nadie.
setTimeout(chequearVersion, 60000);  setInterval(chequearVersion, 600000);
reloj();              setInterval(reloj, 10000);
actualizar();         setInterval(actualizar, REFRESCO);
// Si cambia el tamaño de la ventana hay que recalcular la grilla y la letra.
window.addEventListener('resize', () => { if (datos.length) pintar(); });
</script>
