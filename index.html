<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- VERSION DE LA PAGINA. Se compara con la del index.html publicado en GitHub Pages para
     avisar cuando la TV quedo con una copia vieja en cache. SUBIRLA EN CADA COMMIT que
     toque este archivo: si no se sube, el aviso nunca salta. -->
<meta name="monitor-version" content="2026-09-23.12">
<title>Monitor Matricería</title>
<style>
  /* Pensado para una TV de 32" a 1920×1080 mirada de lejos: fondo oscuro, letra
     grande y NADA de scroll. Todo se mide en vh/vw, así el mismo archivo sirve
     igual en 1366×768 o en un monitor vertical sin tocar una línea. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0d1117;color:#e6edf3;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.6vh 2vw;border-bottom:.35vh solid #21262d;gap:2vw;flex:0 0 auto;
  }
  .titulo{display:flex;align-items:baseline;gap:1.4vw}
  .titulo h1{font-size:4.2vh;letter-spacing:.06em;font-weight:800}
  .titulo .sub{font-size:2.2vh;color:#8b949e}
  .reloj{font-size:4.2vh;font-weight:700;font-variant-numeric:tabular-nums}
  .reloj .fecha{display:block;font-size:1.8vh;font-weight:400;color:#8b949e;text-align:right}
  /* Lector de resolucion: APAGADO por defecto (en la TV es ruido). Se prende con ?res=1
     cuando hay que averiguar con que medida dibuja una pantalla nueva. */
  .res{
    font-size:1.7vh;font-variant-numeric:tabular-nums;color:#8b949e;text-align:right;
    background:#161b22;border:.25vh solid #30363d;border-radius:.8vh;padding:.6vh 1vw;
  }
  .res b{color:#e6edf3;font-size:2.1vh;display:block}
  .res.oculto{display:none}

  /* Flex en vez de grid: con la ultima fila incompleta (10 matrices en 4 columnas) las que
     quedan se CENTRAN en vez de dejar un hueco a la derecha. Las medidas de cada tarjeta
     las calcula el JS para que entren todas. */
  main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
       padding:1.6vh 2vw;min-height:0;overflow:hidden}

  /* UN RENGLON POR MATRIZ, CON EL FORMATO DE CUADRO SINOPTICO (pedido de Elias,
     23/09/2026: "se va a ver todo en una linea con fecha ingreso, descripcion y estado" +
     "aplicar el formato de cuadro sinoptico, sin excluir ninguna regla"). De ese formato
     salen, una por una:
       - ancho de columna segun el DATO, no segun el titulo  -> lo mide ajustarColumnas()
         (medido a 962x485 con 11 matrices: "Prio." pedia 50px cuando el numero ocupa 23,
          e "Ingreso" pedia 70 cuando "22/09" ocupa 48. Las dos son UNA palabra, asi que no
          se pueden partir en dos lineas: el formato manda abreviar. "#" e "Ing." bajan la
          tabla de 499 a 450px y ya ninguna columna la manda el titulo)
       - titulo mas grande que el contenido (16 contra 14)   -> .th span va a 1.14em
       - centrado horizontal y vertical                      -> en las celdas y en la tabla
       - sin ancho fijo, sin columnas vacias
     EXCEPCION pedida por Elias: "por el color y el relleno segui la estetica de la pagina".
     O sea que el cuadro conserva el fondo de los renglones, la barra del estado y el chip
     de color; el resto del formato se cumple tal cual.
       - ordenado por gravedad de mayor a menor              -> lo trae la consulta, por demora
       - tabla solo con 3 filas o mas; con menos, lista      -> con n<3 no se dibuja el encabezado
     Todo en EM sobre --fs, que calcula el JS segun cuantos renglones hay. */
  /* width:auto y columnas medidas = columnas proximas, sin ancho sobrante. La tabla queda
     del ancho de sus datos y el <main> la centra en la pantalla. */
  .tabla{display:flex;flex-direction:column;font-size:var(--fs,16px);width:auto;max-width:100%}
  .th{display:flex;align-items:flex-end;gap:.55em;padding:0 .9em .3em}
  .th span{font-size:1.14em;color:#8b949e;line-height:1;white-space:nowrap;text-align:center}
  .fila{
    display:flex;align-items:center;gap:.55em;padding:.3em .9em;margin-bottom:.16em;
    background:#161b22;border-radius:.35em;position:relative;overflow:hidden;
  }
  .fila:last-child{margin-bottom:0}
  .fila::before{content:'';position:absolute;left:0;top:0;bottom:0;width:.28em;background:var(--c,#58a6ff)}
  /* La demora no ocupa columna: se ve en el color de la fecha, como en el resto de la app. */
  .fila.aviso  .c-fecha{color:#e3b341}
  .fila.alerta .c-fecha{color:#ff7b72}
  .c-estado span{display:flex;align-items:center;gap:.4em;min-width:0}
  .c-estado i{
    font-style:normal;display:inline-block;padding:.12em .7em;border-radius:99px;flex:0 0 auto;
    font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    background:var(--cb,#1f3350);color:var(--c,#58a6ff);white-space:nowrap;
  }
  .c-prio, .c-fecha, .c-desc, .c-estado{display:flex;align-items:center;justify-content:center;min-width:0}
  /* La prioridad es el orden en que hay que atacarlas: la elige Planify, aca solo se muestra. */
  .c-prio  {flex:0 0 var(--w-prio,auto);font-variant-numeric:tabular-nums;font-weight:800}
  .c-fecha {flex:0 0 var(--w-fecha,auto);font-variant-numeric:tabular-nums}
  .c-desc  {flex:0 0 var(--w-desc,auto);justify-content:center}
  .c-desc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .c-estado{flex:0 0 var(--w-estado,auto);gap:.4em}
  /* Que se esta esperando: sin eso, "Esperando" no le dice a nadie que falta. */
  .c-estado em{font-style:normal;font-size:.8em;color:#8b949e;white-space:nowrap;
               overflow:hidden;text-overflow:ellipsis;max-width:14em}
  .vacio{
    flex:1 1 100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:2vh;color:#8b949e;font-size:4vh;text-align:center;
  }
  .vacio .emoji{font-size:9vh}

  footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:1.1vh 2vw;border-top:.35vh solid #21262d;font-size:1.9vh;color:#8b949e;gap:2vw;
  }
  #estadoConn.mal{color:#ff7b72;font-weight:700}

  /* Cartel de version vieja: rojo brillante, letras blancas, arriba de todo. Empuja el
     tablero hacia abajo en vez de taparlo (es un flex item mas), asi no esconde ninguna
     matriz. Late despacio para que se note desde lejos sin marear. */
  #cartelVer{
    display:none;flex:0 0 auto;background:#e5001d;color:#fff;text-align:center;
    font-size:3.2vh;font-weight:800;letter-spacing:.04em;padding:1.4vh 2vw;
    text-transform:uppercase;animation:latir 2.4s ease-in-out infinite;
  }
  #cartelVer.on{display:block}
  @keyframes latir{0%,100%{background:#e5001d}50%{background:#ff2a3d}}

</style>
</head>
<body>
  <div id="cartelVer"></div>
  <header>
    <div class="titulo">
      <h1>🛠️ MATRICERÍA</h1>
      <span class="sub" id="resumen">cargando…</span>
    </div>
    <div style="display:flex;align-items:center;gap:1.2vw">
      <div class="res" id="res"></div>
      <div class="reloj"><span id="hora">--:--</span><span class="fecha" id="fecha"></span></div>
    </div>
  </header>

  <main id="grilla"></main>

  <footer>
    <span id="estadoConn">Conectando…</span>
    <span id="pie">Se carga desde Planify · Matricería</span>
  </footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MONITOR DE MATRICERÍA — visualizador, NO carga nada.
   Lee planify.v_matriceria_monitor del proyecto Supabase de Gestión Virgilio.
   Lo que se ve acá lo cargan Pregelj y Cornejo desde el módulo "Matricería"
   de Planify, y la TV muestra la MISMA planilla: problema, tarea a realizar,
   ya hecho, quién, HS, salida estimada y la foto si la subieron.
   Este archivo no escribe: la clave publishable sólo tiene SELECT sobre esa
   tabla y sobre el bucket de las fotos (los writes van por RPC, ver Planify).
   Parámetros por URL (opcionales):
     ?refresco=30     cada cuántos segundos vuelve a pedir los datos
     ?columnas=4      fuerza las columnas (por defecto las calcula sola)
   TODAS las matrices del taller entran SIEMPRE en una sola pantalla: no hay
   carrusel. La grilla y el tamaño de letra se calculan segun cuantas haya, asi
   que con mas matrices las tarjetas se achican en vez de esconderse.
     ?res=1           muestra el lector de resolucion (apagado por defecto)
     ?autorecarga=0   deja el cartel rojo pero NO recarga sola la pagina
   ══════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://hrxfctzncixxqmpfhskv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BqpAgZH6ty-9wft10_YMhw_0rcIPuWT'; // clave PÚBLICA de solo lectura

const qs         = new URLSearchParams(location.search);
const num        = (k, def) => { const v = parseInt(qs.get(k), 10); return Number.isFinite(v) && v > 0 ? v : def; };
const REFRESCO   = Math.max(5, num('refresco', 30)) * 1000;
const COLUMNAS   = num('columnas', 0);   // 0 = las calcula sola segun cuantas matrices hay
const VER_RES    = qs.get('res')   === '1';   // apagado por defecto: en la TV es ruido

// Los cinco estados y como se llaman en la TV. Si se agrega uno hay que tocar tambien el
// check de planify.matrices_ingresos, la RPC planify_matriz_estado y la lista MAT_ESTADOS
// de Planify: si no, no se puede cargar desde la app.
const ESTADOS = {
  ingresada:  { txt:'Ingresado',  c:'#58a6ff', cb:'#132c4d' },
  en_proceso: { txt:'Proceso',    c:'#e3b341', cb:'#3a2f10' },
  ver_damian: { txt:'Ver Damián', c:'#d2a8ff', cb:'#2f2150' },
  esperando:  { txt:'Esperando',  c:'#ff7b72', cb:'#3d1d1b' },
  terminada:  { txt:'Terminada',  c:'#3fb950', cb:'#12301a' }
};

// Abreviaturas de la descripcion, para ganar ancho sin perder sentido. Hoy solo "corte",
// que es la palabra que mas se repite en el maestro de matrices; agregar otra es sumarle
// un par a esta lista.
const ABREVIATURAS = [[/\bcortes?\b/gi, 'C/']];
function abreviar(t){
  let r = String(t || '');
  for (const [re, x] of ABREVIATURAS) r = r.replace(re, x);
  return r.replace(/\s+/g, ' ').trim();
}

let datos = [];        // última respuesta buena
let ultimaOk = null;   // cuándo trajo datos por última vez

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fecha = d => { if (!d) return '—'; const [y,m,dd] = String(d).split('-'); return dd+'/'+m; };

async function traer(){
  // estado=neq.terminada: el monitor muestra lo que está EN el taller. Cuando la matriz se
  // termina (o se cierra su tarea en Planify) desaparece sola de la TV.
  // El orden lo decide la PRIORIDAD que eligieron en Planify (1 primero). Las que todavía
  // no tienen número quedan al final, por demora, como antes.
  const url = SUPABASE_URL + '/rest/v1/v_matriceria_monitor'
            + '?select=*&estado=neq.terminada'
            + '&order=prioridad.asc.nullslast,dias_demora.desc,fecha_ingreso.asc';
  const r = await fetch(url, { headers:{ apikey:SUPABASE_KEY, 'Accept-Profile':'planify' }, cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

async function actualizar(){
  try{
    const nuevos = await traer();
    // Sólo se pisa lo que se ve si la respuesta vino bien: un corte de red no tiene que
    // dejar la TV en blanco, se sigue viendo lo último que se supo.
    datos = Array.isArray(nuevos) ? nuevos : [];
    ultimaOk = new Date();
    $('estadoConn').textContent = 'En línea · ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    $('estadoConn').className = '';
    pintar();
  }catch(e){
    $('estadoConn').textContent = 'SIN CONEXIÓN' + (ultimaOk ? ' · último dato ' + ultimaOk.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '');
    $('estadoConn').className = 'mal';
  }
}

// Descripcion de la matriz. El NUMERO ya no se muestra: si lo cargaron, se muestra la
// descripcion del maestro; si escribieron texto libre, eso ES la descripcion. El numero se
// sigue usando en Planify para que la misma matriz no termine cargada con una descripcion
// distinta cada vez.
function descripcion(m){
  return abreviar(String(m.nombre_matriz || '').trim() || String(m.numero_matriz || '').trim());
}

// El numero que se ve es la POSICION en la lista, no el valor guardado: asi, cuando una
// matriz se termina, las que quedan siguen numeradas 1, 2, 3... sin huecos.
function fila(m, i){
  const e = ESTADOS[m.estado] || ESTADOS.ingresada;
  const d = Number(m.dias_demora || 0);
  const clase = d >= 7 ? 'alerta' : (d >= 3 ? 'aviso' : '');
  // Si esta esperando algo, va al lado del chip: "Esperando" solo no dice que falta.
  const espera = m.estado === 'esperando' ? String(m.espera || '').trim() : '';
  return `<div class="fila ${clase}" style="--c:${e.c};--cb:${e.cb}">`
       + `<div class="c-prio"><span>${i + 1}</span></div>`
       + `<div class="c-fecha"><span>${fecha(m.fecha_ingreso)}</span></div>`
       + `<div class="c-desc"><span>${esc(descripcion(m))}</span></div>`
       + `<div class="c-estado"><span><i>${e.txt}</i>${espera ? `<em>${esc(espera)}</em>` : ''}</span></div>`
       + `</div>`;
}

// Ancho de columna SEGUN EL DATO, no segun el titulo: se mide lo que ocupan de verdad las
// celdas y la columna queda del ancho del valor mas largo. El titulo, si no entra, se parte
// en dos lineas (por eso .th span va con white-space normal), que es lo que pide el formato.
function ajustarColumnas(cont){
  const tabla = cont.querySelector('.tabla');
  if (!tabla) return;
  for (const col of ['prio', 'fecha', 'desc', 'estado']){
    let max = 0;
    // Se mide el dato Y el titulo. Los titulos ya vienen abreviados ("#", "Ing."), asi que
    // hoy el dato gana en las cuatro columnas y el ancho sale del dato, como pide el formato.
    // El max() queda igual de red de seguridad: si manana un titulo se alarga, la columna lo
    // respeta en vez de dejar un encabezado pisando al de al lado.
    tabla.querySelectorAll('.fila .c-' + col + ' span, .th .c-' + col).forEach(el => {
      max = Math.max(max, el.getBoundingClientRect().width);
    });
    if (max) tabla.style.setProperty('--w-' + col, Math.ceil(max) + 'px');
  }
}

const EM_FILA  = 1.95;   // alto de un renglon con su relleno y su separacion, en em
const EM_TH    = 2.6;    // el encabezado, con el titulo a 1,14em y lugar para dos lineas
const EM_ANCHO = 27;     // prioridad + fecha + estado + separaciones + lo minimo de la descripcion
const FS_MAX   = 40;     // con una o dos matrices, que no quede un renglon gigante

function pintar(){
  const cont = $('grilla');
  const n = datos.length;

  $('resumen').textContent = n
    ? n + (n === 1 ? ' matriz en el taller' : ' matrices en el taller')
    : 'sin matrices en el taller';

  if (!n){
    cont.innerHTML = '<div class="vacio"><span class="emoji">✅</span><span>No hay ninguna matriz en el taller</span></div>';
    return;
  }

  const cs    = getComputedStyle(cont);
  const ancho = cont.clientWidth  - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight)  || 0);
  const alto  = cont.clientHeight - (parseFloat(cs.paddingTop)  || 0) - (parseFloat(cs.paddingBottom) || 0);

  // Tabla solo con 3 filas o mas; con menos va como lista, sin encabezado.
  const conTitulos = n >= 3;
  const fs = Math.max(9, Math.min(FS_MAX,
                                  alto / (n * EM_FILA + (conTitulos ? EM_TH : 0)),
                                  ancho / EM_ANCHO));

  cont.innerHTML = `<div class="tabla" style="--fs:${fs.toFixed(2)}px">`
    + (conTitulos
        ? '<div class="th"><span class="c-prio">#</span><span class="c-fecha">Ing.</span>'
        + '<span class="c-desc">Descripción</span><span class="c-estado">Estado</span></div>'
        : '')
    + datos.map((m, i) => fila(m, i)).join('')
    + '</div>';

  // Segunda pasada por el ANCHO: con las columnas ya medidas, si la descripcion mas larga
  // no entra a lo ancho se achica la letra hasta que entre (en vez de cortar el texto).
  ajustarColumnas(cont);
  const tabla = cont.querySelector('.tabla');
  const natural = tabla.getBoundingClientRect().width;
  if (natural > ancho){
    const fs2 = Math.max(9, fs * (ancho / natural));
    tabla.style.setProperty('--fs', fs2.toFixed(2) + 'px');
    ['prio','fecha','desc','estado'].forEach(c => tabla.style.removeProperty('--w-' + c));
    ajustarColumnas(cont);
  }
}

function pintarRes(){
  const el = $('res');
  if (!el) return;
  if (!VER_RES){ el.className = 'res oculto'; return; }
  const vw = Math.round(window.innerWidth), vh = Math.round(window.innerHeight);
  const sw = (window.screen && screen.width)  || 0;
  const sh = (window.screen && screen.height) || 0;
  const dpr = Math.round((window.devicePixelRatio || 1) * 100) / 100;
  const igual = sw === vw && sh === vh;
  el.innerHTML = `<b>${vw} × ${vh}</b>`
    + (igual ? 'pantalla completa' : `pantalla ${sw} × ${sh}`)
    + (dpr !== 1 ? ` · escala ${dpr}×` : '');
}

// ── ¿La TV quedo con una copia vieja? ─────────────────────────────────────────────────
// La pagina se publica sola en GitHub Pages al pushear a main, pero el navegador de la TV
// se queda con el index.html que bajo la primera vez: los DATOS se refrescan cada 30 s, el
// ARCHIVO no. Aca se baja el index.html publicado (sin cache), se le lee el
// <meta name="monitor-version"> y se compara con el de la copia que esta corriendo.
// Si no coinciden, cartel rojo. Si falla la bajada (TV sin red), no se toca nada.
const VERSION_LOCAL = (document.querySelector('meta[name="monitor-version"]') || {}).content || '';
const AUTORECARGA   = qs.get('autorecarga') !== '0';
let   avisoVersion  = false;

function mostrarCartel(txt){
  const el = $('cartelVer');
  if (!el) return;
  el.textContent = txt;
  el.className = 'on';
}

async function chequearVersion(){
  if (!VERSION_LOCAL) return;                       // sin meta no hay nada que comparar
  try{
    const r = await fetch(location.pathname + '?_v=' + Date.now(), { cache:'no-store' });
    if (!r.ok) return;
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const meta = doc.querySelector('meta[name="monitor-version"]');
    const publicada = meta && meta.getAttribute('content');
    if (!publicada || publicada === VERSION_LOCAL) return;   // al dia (o no se pudo leer)
    if (avisoVersion) return;
    avisoVersion = true;

    // Anti-bucle: si ya se recargo por ESTA version y seguimos con la vieja, es la cache de
    // la TV y no hay nada que hacer desde acá — queda el cartel pidiendo recarga a mano.
    let intentada = null;
    try{ intentada = sessionStorage.getItem('mat_ver'); }catch(e){}
    if (!AUTORECARGA || intentada === publicada){
      mostrarCartel('⚠ Pantalla desactualizada · recargá la página con el control');
      return;
    }
    try{ sessionStorage.setItem('mat_ver', publicada); }catch(e){}
    mostrarCartel('⚠ Pantalla desactualizada · actualizando…');
    setTimeout(() => {
      const u = new URL(location.href);
      u.searchParams.set('_v', publicada);           // pisa la cache del navegador de la TV
      location.replace(u.toString());
    }, 4000);
  }catch(e){ /* sin red: se reintenta en el proximo chequeo */ }
}

function reloj(){
  const n = new Date();
  $('hora').textContent  = n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  $('fecha').textContent = n.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
}

pintarRes();          window.addEventListener('resize', pintarRes);
// El primer chequeo al minuto (por si la TV arranco con una copia vieja de la cache) y
// despues cada 10 minutos: es un archivo de 20 KB, no molesta a nadie.
setTimeout(chequearVersion, 60000);  setInterval(chequearVersion, 600000);
reloj();              setInterval(reloj, 10000);
actualizar();         setInterval(actualizar, REFRESCO);
// Si cambia el tamaño de la ventana hay que recalcular la grilla y la letra.
window.addEventListener('resize', () => { if (datos.length) pintar(); });
</script>
</body>
</html>
